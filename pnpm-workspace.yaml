# The workspace members and the ONE place a shared version is written down.
#
# `catalog:` pins every shared version once (ru-code's mechanism, report 1.2 Q6); every
# package manifest in this repo consumes `"catalog:"` and carries no version literal, so a
# bump happens here and nowhere else. The versions are copied from `ru-code-packages` so the
# locally-linked builds and a registry install agree:
#   @effect/tsgo, @typescript/native-preview -> ru-code-packages/package.json:17,19
#   tsdown, vite-plus, @types/node           -> ru-code-packages/packages/pixso-cli/package.json:23-25
#   @smart-tools/pixso-core                  -> ru-code-packages/packages/pixso-core/package.json:3
#   oxlint, oxfmt                            -> the versions `vite-plus@0.2.2` itself pins
#                                               (`node_modules/vite-plus/package.json:366-367`);
#                                               `vp lint` / `vp fmt` run their OWN bundled copies,
#                                               so these two entries exist to make the linter and
#                                               formatter resolvable at the root — `.oxlintrc.json:2`
#                                               and `.oxfmtrc.json:2` point their `$schema` at
#                                               `./node_modules/<tool>/configuration_schema.json`,
#                                               the same paths ru-code-packages uses
#                                               (`ru-code-packages/.oxlintrc.json:2`,
#                                               `ru-code-packages/.oxfmtrc.json:2`). Pinned EQUAL to
#                                               what vite-plus bundles so the editor's schema and
#                                               the binary that actually runs never disagree.
#   typescript                               -> ru-code-packages/oxlint-plugin-t3code/package.json:17
#                                               (`~6.0.3`; resolves to the 6.0.3 that repo has
#                                               installed, and the same range ru-code's own
#                                               catalog pins — report 1.2 Q6)
#
# `typescript` earns its place even though nothing here invokes `tsc`: `tsdown`'s dts step
# (`rolldown-plugin-dts`) loads the real compiler to emit `.d.mts`, and without it every
# library build fails with "Cannot find module 'typescript'". `tsgo`
# (`@typescript/native-preview`) is the TYPECHECK tool and does not cover that.
#
# `@smart-tools/pixso-core` is the one catalog entry the gitignored `.pnpmfile.cjs` hook
# rewrites to `file:<local build>` when the `ru-code-packages` symlink is present
# (`.pnpmfile.cjs:38-53`); without the symlink this pin is what installs from the registry.
packages:
  - "cli"
  - "packages/*"

catalog:
  "@effect/tsgo": 0.13.2
  "@smart-tools/pixso-core": 1.0.1
  "@tailwindcss/vite": ^4.0.0
  "@tanstack/react-virtual": ^3.11.0
  "@types/aria-query": ^5.0.4
  "@types/node": 24.12.4
  "@types/react": ^18.3.12
  "@types/react-dom": ^18.3.1
  "@typescript/native-preview": 7.0.0-dev.20260604.1
  "@vitejs/plugin-react": ^4.3.4
  # hackathon2026 analyzer/dashboard deps (versions copied from
  # hackathon2026/ds-analyzer/package.json and .../dashboard/package.json — the h4 port)
  aria-query: ^5.3.2
  esbuild: ^0.25.0
  eslint: ^9.18.0
  eslint-plugin-jsx-a11y: ^6.10.2
  ignore: ^7.0.6
  oxfmt: 0.57.0
  oxlint: 1.72.0
  postcss: ^8.5.24
  postcss-scss: ^4.0.9
  react: ^18.3.1
  react-diff-viewer-continued: ^4.0.5
  react-dom: ^18.3.1
  recharts: ^2.15.0
  tailwindcss: ^4.0.0
  ts-morph: ^25.0.1
  tsdown: 0.20.3
  typescript: ~6.0.3
  typescript-eslint: ^8.20.0
  vite: ^6.0.0
